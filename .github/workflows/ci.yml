name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && go vet -tags docker ./integration && go vet -tags zfs ./internal/volume
      # Every transaction also reads the whole state and fails if what it
      # read again in part differs (internal/store/reload.go).
      - run: go test -race ./...
        env:
          MURDER_VERIFY_RELOADS: "1"
      # GitHub-hosted runners ship Docker, so the full tenant lifecycle runs too.
      - run: go test -tags docker -count=1 ./integration
      - run: go build -o murder ./cmd/murder
