# Publishes a release for a tag v*: murder for Linux on amd64 and arm64,
# install.sh, and SHA256SUMS of all three, which install.sh checks. Run by
# hand, it only builds them and keeps them as the run's artifact.
#
# Building and testing runs the repository's code, so it only reads; only
# the job that publishes may write, and it runs nothing of the repository:
# it takes the built files and makes the release of them. Actions are
# pinned to commits, not to tags that can move.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # What CI checks on main, so a tag on an untested commit publishes
      # nothing.
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          MURDER_VERIFY_RELOADS: "1"
      - name: Build
        env:
          RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-X main.release=${RELEASE}" -o "dist/murder-linux-$arch" ./cmd/murder
          done
          cp scripts/install.sh dist/install.sh
          (cd dist && sha256sum murder-linux-amd64 murder-linux-arm64 install.sh > SHA256SUMS && cat SHA256SUMS)
      - name: Check install.sh against the build
        run: |
          python3 -m http.server --directory dist 8765 >/dev/null 2>&1 &
          sleep 1
          sudo env MURDER_BASE_URL=http://127.0.0.1:8765 sh dist/install.sh
          /usr/local/bin/murder version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: murder
          path: dist/
          if-no-files-found: error
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: murder
          path: dist
      - name: Check the files against their sums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/murder-linux-amd64 dist/murder-linux-arm64 dist/install.sh dist/SHA256SUMS --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
