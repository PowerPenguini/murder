# /etc/murder/agent.yaml
node: node-fsn-1                   # stored by "murder init" (host name if unset); must match afterwards
baseDomain: example.com            # tenants live at <tenant>.example.com
database: /var/lib/murder/murder.db  # apps, tenants, sealed secrets, audit log (SQLite)
masterKeyFile: /etc/murder/master.key
socket: /run/murder/agent.sock
socketGroup: murder                # members may run the murder CLI without root (they control every tenant)
dockerSocket: /var/run/docker.sock
registries:                        # private registries: images are pulled with these logins
  - host: ghcr.io                  # GitHub's container registry; another registry is another entry
    username: your-github-user
    tokenFile: /etc/murder/ghcr.token   # a token that may only read packages (0600)
# registryAuthFile: /etc/murder/registry.json   # or a docker config.json with "auths"
networkPool: 10.240.0.0/16         # one /28 per tenant network (the tenant at .2); must not overlap host or Docker networks
firewall: nftables                 # keeps tenants from the host and private networks; off only for development
metrics: 127.0.0.1:9464            # /metrics for Prometheus or VictoriaMetrics (tenant names: keep it private); unset = off

volumes:
  driver: zfs                      # or: driver: dir, root: /srv/murder/tenants
  parent: tank/murder/tenants      # datasets mount below /srv/murder/tenants (mountRoot)

edge:                              # served by "murder edge"
  http: ":80"                      # open to the internet: tenants' own domains get their certificates over HTTP-01 here
  https: ":443"
  # metrics: 127.0.0.1:9465         # the edge's own /metrics
  # drain: 30s                      # how long a replaced edge finishes its requests
  # routesHold: 15s                 # after a reboot, how long requests wait for the agent's routes before the saved ones serve
  # relayPort: 7402                 # in a cluster: where other nodes pass requests on; the same on every node
  tls:
    mode: acme                     # off | internal | acme
    storage: /var/lib/murder/certs
    email: ops@example.com         # the ACME account's contact; tenants' own domains' certificates come from the same CA
    dnsProvider: hetzner           # hetzner (Hetzner Cloud DNS) | namecheap
    dnsTokenFile: /etc/murder/dns.token

# backups:                         # whole, compressed, encrypted backups to a bucket (see README)
#   mode: production               # test: no lock, the bucket can be destroyed at once
#   endpoint: https://hel1.your-objectstorage.com
#   region: hel1
#   bucket: acme-murder-backups
#   accessKeyFile: /etc/murder/s3.access
#   secretKeyFile: /etc/murder/s3.secret
#   recipient: age1...             # public key; keep the private key offline

# cluster:                         # replicate the state to other nodes (see README)
#   address: 10.0.0.2:7400         # this node on the private network
#   dir: /var/lib/murder/cluster
#   failover:                      # run a dead node's tenants from their replicas (docs/failover.md)
#     after: 30s                   # unanswered this long counts as dead
#     hetzner:
#       tokenFile: /etc/murder/hcloud.token   # read/write token of the project (0600)
#       # servers: {n1: murder-n1}           # server names, where not the node names

defaults: {memoryMB: 512, cpus: 1, pids: 512, diskGB: 20}   # diskGB needs the zfs driver
reconcileInterval: 10s
imageChecks: 5m                    # the leader asks registries for newer images of apps' tags; 0 never
