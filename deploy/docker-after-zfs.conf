# /etc/systemd/system/docker.service.d/murder.conf
# Docker restarts tenant containers at boot (restart policy unless-stopped).
# Starting it after ZFS has mounted every dataset keeps those containers from
# binding the empty directories under not-yet-mounted datasets. The agent
# still checks each container's mount and replaces any that missed its data.
[Unit]
After=zfs-mount.service
Wants=zfs-mount.service
