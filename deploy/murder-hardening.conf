# Installed as /etc/sysctl.d/91-murder-hardening.conf; `sudo sysctl --system`
# applies it at once. These are the kernel settings "murder doctor" checks.
# Docker needs net.ipv4.ip_forward = 1, which this file leaves alone.

# Ignore ICMP redirects, with which a host on the same network could
# reroute this server's traffic through itself; and send none, as a server
# that only forwards to its own containers has nothing to redirect.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Drop packets whose source address no route leads back to. Loose (2), not
# strict (1): strict drops replies that come back on another interface,
# such as a private network's, when routes are asymmetric.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Keep answering connections during a SYN flood.
net.ipv4.tcp_syncookies = 1

# Keep kernel addresses and the kernel log from unprivileged users, and BPF
# from them too: each eases exploiting a kernel bug from a container that
# breaks out as a user. Once 1, unprivileged_bpf_disabled stays so until a
# reboot.
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
