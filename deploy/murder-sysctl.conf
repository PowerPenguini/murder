# Installed as /etc/sysctl.d/90-murder.conf; `sudo sysctl -p` on that file
# applies it at once, to open connections too, and deleting it plus a reboot
# (or setting the value back to 1) undoes it.
#
# A connection that was idle longer than its retransmission timeout, such as
# a browser's between two clicks, keeps the sending rate it had reached
# instead of starting over at about 14 KB per round trip: a 60 KB response
# then takes one round trip instead of three. If the client's link got
# slower meanwhile, one response may lose a few packets and be resent, as
# it would have been slow-started; Linux paces what it sends either way.
net.ipv4.tcp_slow_start_after_idle = 0
