# AddHoc (the transport company app): one tenant per company, each with its
# own database and receipt files in its data directory. The image is
# backend/Dockerfile of PowerPenguini/AddHoc: one binary serving the API and
# the web app, as a fixed non-root user, on port 8080. It sets its own
# security headers and compresses its responses; the edge adds HSTS.
#
#   murder app apply addhoc.yaml -wait 5m
#   murder tenant create acme -app addhoc -env APP_ADMIN_EMAIL=owner@acme.pl -wait 5m
#   murder tenant secret acme APP_ADMIN_PASSWORD     # the first login's password
image: ghcr.io/powerpenguini/addhoc:latest   # pinned to a digest when applied
user: "10001:10001"                          # the image's service user; owns /data
healthPath: /api/health
env:
  APP_ENV: production
  APP_TIME_ZONE: Europe/Warsaw
  ADDR: ":8080"
  DATA_DIR: /data
  APP_PUBLIC_URL: "{{url}}"                  # https://<tenant>.<baseDomain>
  TRUSTED_PROXIES: "{{network}}"             # the edge connects from this range
  COOKIE_SECURE: "true"
  # Also the contact address for web push, which Apple wants to be a real
  # mailbox: give each tenant its owner's address (-env at create).
  APP_ADMIN_EMAIL: "admin@{{host}}"
secrets:
  SESSION_SECRET: hex                        # 32 random bytes, 64 characters
  SECRETS_KEY: hex                           # seals integration secrets (OpenAI key)
  APP_ADMIN_PASSWORD: {kind: password, bytes: 24}   # the first administrator's, 24 characters
limits:
  memoryMB: 512
  cpus: 1
  pids: 512                                  # Go adds a thread per blocking call
# /tmp, 256 MB, takes large uploads in flight (Murder's default tmpfs).
