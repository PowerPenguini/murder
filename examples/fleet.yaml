# The node's tenants:  corral apply examples/fleet.yaml -wait 3m
# apply creates missing tenants and updates changed ones. It never removes a
# tenant: archive one with "corral tenant archive NAME".
apps:
  web: apps/web.yaml                   # path relative to this file, or an inline spec
tenants:
  acme: {app: web}
  beta:
    app: web
    env: {TZ: Europe/Berlin}           # added to, or replacing, the app's env
    limits: {memoryMB: 768}            # replaces the app's limits field by field
  gamma:
    app: web
    image: ghcr.io/example/web:1.5     # e.g. a canary
