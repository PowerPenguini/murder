# murder plugin apply examples/plugins/openai.yaml
# murder plugin key openai -file /root/openai.key
kind: container
image: ghcr.io/powerpenguini/murder-openai:latest   # Murder's plugin, pinned by digest as it is installed
# hosts: [api.groq.com]              # another API that speaks OpenAI's, in place of api.openai.com
# config:
#   upstream: https://api.groq.com/openai   # its host, and the path its API is under
#   allow: ["POST /v1/batches"]             # endpoints beyond those whose use is counted; shared by every tenant
limits:
  - {metric: tokens, per: month, amount: 2000000}              # hard: 429 once used
  - {metric: requests, per: day, amount: 5000, mode: soft}     # soft: said in the audit log
