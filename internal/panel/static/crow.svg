    <path id="s" d="M4.5 34 C3 26 3.6 16 8 10 C11 4.5 17 2 22 2.6 C25.5 3 28.5 5 30.5 7.2 L32 6.6 L33.4 7.8 C39 7.6 44.5 9.8 48 15 L46.6 15.8 C42 16.6 37 17 32.4 17.6 L30.8 21 L28 20.6 L28.8 25 L25.8 24.4 L26.4 29 L23.4 28.4 L23 34 Z"/>
    <mask id="m0" maskUnits="userSpaceOnUse" x="-20" y="-20" width="200" height="90">
      <rect x="-20" y="-20" width="200" height="90" fill="#fff"/>
      <use href="#s" transform="translate(-9 0)" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
      <use href="#s" transform="translate(0 0)" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
    </mask>
    <mask id="m1" maskUnits="userSpaceOnUse" x="-20" y="-20" width="200" height="90">
      <rect x="-20" y="-20" width="200" height="90" fill="#fff"/>
      <use href="#s" transform="translate(0 0)" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g fill="#ececec">
    <g mask="url(#m0)"><use href="#h" transform="translate(-18 0)"/></g>
    <g mask="url(#m1)"><use href="#h" transform="translate(-9 0)"/></g>
    <use href="#h" transform="translate(0 0)"/>
