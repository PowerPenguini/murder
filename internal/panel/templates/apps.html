{{define "content"}}{{$d := .Data}}
<div class="head">
  <h1>Apps</h1>
</div>
<p class="lead">Specs their tenants share; a change rolls out to every one.</p>

<section class="near">
  <table>
    <thead><tr><th>App</th><th class="hide-narrow">Image</th><th>Live tenants</th><th class="hide-narrow">Changed</th></tr></thead>
    <tbody>
    {{range $i, $a := $d.Apps}}{{with $a}}
      <tr>
        <td><a href="/apps/{{.Name}}">{{.Name}}</a></td>
        <td class="mono dim hide-narrow" title="{{.Spec.Image}}">{{short .Spec.Image}}</td>
        <td class="barcell"><div class="barline"><svg class="bar" viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true"><rect width="100" height="6" fill="#1d1d1d"/><rect width="{{(index $d.Bars $i).Width}}" height="6" fill="#b0b0b0"/></svg><span class="num">{{len .Tenants}}</span></div></td>
        <td class="when hide-narrow">{{ago .UpdatedAt}} ago</td>
      </tr>
    {{end}}{{else}}
      <tr><td colspan="4" class="empty">No app yet.</td></tr>
    {{end}}
    </tbody>
  </table>
</section>

<section>
  <details {{if $d.Name}}open{{end}}>
    <summary class="button">New app</summary>
    <div class="panel">
      <form method="post" action="/apps" class="stack">
        <label class="field">Name <input type="text" name="name" value="{{$d.Name}}" placeholder="web" aria-label="the app's name" autocomplete="off" spellcheck="false" required class="short" maxlength="63" pattern="[a-z0-9]([a-z0-9\-]*[a-z0-9])?" title="lowercase letters, digits and hyphens, a letter or digit at each end"></label>
        <label class="field"><span>Spec, as an app file of <code>murder app apply</code></span>
          <textarea name="file" rows="10" spellcheck="false" aria-label="the app's spec">{{$d.File}}</textarea></label>
        <div><button type="submit" class="primary">Create the app</button></div>
      </form>
    </div>
  </details>
</section>
{{end}}
