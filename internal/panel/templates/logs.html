{{define "content"}}{{$d := .Data}}
<div class="title"><h1>{{$d.Tenant}}</h1><span class="sub">last {{$d.Tail}} lines</span></div>
<p class="lead"><a href="/tenants/{{$d.Tenant}}">Back</a> · <a href="?tail=2000">More lines</a></p>
<section data-still class="near">
  <pre class="logs">{{if $d.Lines}}{{$d.Lines}}{{else}}Nothing written yet.{{end}}</pre>
</section>
{{end}}
